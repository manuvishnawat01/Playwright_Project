[pytest]
# Add current directory to Python path so imports like 'from pages...' work easily
pythonpath = .

# Default command line options for running tests
# -v: verbose output
# -s: print live stdout output (so print statements are visible)
addopts = -v -s

# Pattern for discovering test files
python_files = test_*.py

# Pattern for discovering test functions
python_functions = test_*
